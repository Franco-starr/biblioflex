worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;

    server {
        listen ${PORT};
        server_name _;
        root /app;
        index index.php;

        # Seguridad: bloquear acceso directo a carpetas internas y archivos sensibles
        location ~ ^/(includes|models|sql|vendor)/ { return 403; }
        location ~ \.env$ { return 403; }

        # Home: / -> public/index.php
        location = / {
            rewrite ^ /public/index.php last;
        }

        # URLs limpias: quitar extensión .php en peticiones directas
        rewrite ^/(.+)\.php$ /$1 permanent;

        # Assets estáticos: /assets/* -> public/assets/*
        location ^~ /assets/ {
            try_files $uri /public$uri =404;
        }

        # Resolución de rutas limpias:
        # /X   -> public/X(.php) | public/X/index.php | admin/X(.php|/index.php)
        location / {
            try_files $uri $uri.php $uri/index.php /public$uri /public$uri.php /public$uri/index.php /admin$uri /admin$uri.php /admin$uri/index.php =404;
        }

        # Ejecución de PHP
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }
}