name: Deploy a InfinityFree

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, mysqli
          coverage: none

      - name: Instalar dependencias (vendor/)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Limpiar dotfiles de vendor (InfinityFree FTP los rechaza)
        run: |
          find vendor -type d -name '.*' -prune -exec rm -rf {} +
          find vendor -name '.*' -type f -delete

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: htdocs/
          dangerous-clean-slate: false
          exclude: |
            .git
            .git*
            .git/**
            .github/
            .github/**
            imagenes/
            imagenes/**
            .env
            sql/
            sql/**
            Dockerfile
            nginx.conf
            docker-entrypoint.sh
            .dockerignore
            Nuevo-documento-de-texto.txt